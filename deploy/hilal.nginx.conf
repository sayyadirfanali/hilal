# /etc/nginx/conf.d/hilal.conf
# certbot adds the HTTPS part to this block.
server {
    listen 80;
    listen [::]:80;
    server_name hilal.irfanali.org;

    # No request logs: the nearby list carries the phone's location in its address.
    # The error log stays at crit, because lower levels record the request line when Hilal is down.
    access_log off;
    error_log /var/log/nginx/hilal-error.log crit;

    # Hilal doesn't compress its responses; MapLibre shrinks from about 1 MB to 280 KB.
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json font/woff2;

    # No other site may show Hilal in a frame, where a hidden page could trick a signed-in person into clicking.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # Browsers that have visited once never try plain HTTP again, for a year.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # Hilal compares Host with Origin on every POST.
        proxy_set_header Host $host;
    }
}

